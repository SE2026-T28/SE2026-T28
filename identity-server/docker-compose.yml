services:
  db:
    image: postgres:16-alpine
    container_name: app04-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: app04_auth
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: change_me_local_only
    ports:
      - "5433:5432"
    volumes:
      - app04_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app04_auth"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  app04_pgdata:
